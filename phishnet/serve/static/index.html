<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PhishNet — Live Test</title>
<style>
  :root{--bg:#0f1216;--card:#171b22;--line:#262c36;--txt:#e6e9ee;--dim:#98a2b3;
        --red:#ff5c5c;--amber:#f5a623;--green:#37c46b;--accent:#4f8cff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 60px}
  h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--dim);margin:0 0 24px;font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 6px}
  input[type=text],textarea{width:100%;background:#0d1015;border:1px solid var(--line);color:var(--txt);
       border-radius:9px;padding:11px 13px;font-size:14px;font-family:inherit;outline:none}
  input[type=text]:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:64px;margin-bottom:4px}
  .row{margin-bottom:14px}
  button{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:12px 22px;
       font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:progress}
  .examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{background:#0d1015;border:1px solid var(--line);border-radius:20px;padding:6px 12px;
       font-size:12px;color:var(--dim);cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--txt)}
  #out{display:none}
  .verdict{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .badge{font-size:15px;font-weight:700;padding:8px 16px;border-radius:10px}
  .b-phish{background:rgba(255,92,92,.14);color:var(--red);border:1px solid rgba(255,92,92,.35)}
  .b-legit{background:rgba(55,196,107,.14);color:var(--green);border:1px solid rgba(55,196,107,.35)}
  .prob{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .meta{color:var(--dim);font-size:13px;margin-left:auto;text-align:right}
  .gates{display:flex;gap:8px;margin:14px 0}
  .gate{flex:1;background:#0d1015;border:1px solid var(--line);border-radius:9px;padding:10px;text-align:center}
  .gate .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  .gate .v{font-size:18px;font-weight:700;margin-top:2px}
  .barbg{height:5px;background:#0d1015;border-radius:3px;margin-top:7px;overflow:hidden}
  .bar{height:100%;background:var(--accent)}
  h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:18px 0 8px}
  ul{margin:0;padding-left:18px} li{margin:4px 0}
  .brand{background:rgba(79,140,255,.1);border:1px solid rgba(79,140,255,.3);border-radius:9px;
       padding:10px 13px;font-size:13px;margin-top:10px}
  .err{color:var(--red);font-size:14px}
  .foot{color:var(--dim);font-size:12px;text-align:center;margin-top:24px}
  code{background:#0d1015;padding:2px 6px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛡️ PhishNet</h1>
  <p class="sub">Multimodal, explainable phishing detection — live model on this machine.</p>

  <div class="card">
    <div class="row">
      <label for="url">URL to test</label>
      <input id="url" type="text" placeholder="http://paypa1-secure-verify.tk/account/login.php" autofocus/>
    </div>
    <div class="row">
      <label for="text">Message / lure text (optional)</label>
      <textarea id="text" placeholder="Your account has been locked. Verify now to avoid suspension."></textarea>
    </div>
    <button id="go">Scan URL</button>
    <div class="examples" id="ex"></div>
  </div>

  <div class="card" id="out"></div>
  <div class="foot">Verdicts come from the trained multimodal model + reputation stage. First scan may take ~2s (model warm-up).</div>
</div>

<script>
const examples = [
  ["http://paypa1-secure-verify.tk/account/login.php","Your account is locked. Verify within 24 hours."],
  ["http://0fficeh-verify.000webhostapp.com/office365/login","Re-validate your Office 365 credentials now."],
  ["https://www.paypal.com/signin",""],
  ["https://login.microsoftonline.com/",""],
  ["http://apple-id-locked.duckdns.org/unlock","Your Apple ID has been disabled."]
];
const exBox = document.getElementById('ex');
examples.forEach(([u,t])=>{
  const c=document.createElement('span'); c.className='chip'; c.textContent=u.replace(/^https?:\/\//,'').slice(0,38);
  c.onclick=()=>{document.getElementById('url').value=u;document.getElementById('text').value=t;};
  exBox.appendChild(c);
});

const out = document.getElementById('out');
const btn = document.getElementById('go');

async function scan(){
  const url = document.getElementById('url').value.trim();
  if(!url){out.style.display='block';out.innerHTML='<span class="err">Enter a URL first.</span>';return;}
  const text = document.getElementById('text').value.trim();
  btn.disabled=true; btn.textContent='Scanning…';
  out.style.display='block'; out.innerHTML='<span class="sub">Running model…</span>';
  try{
    const r = await fetch('/scan',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url,text:text||null,explain:true})});
    const d = await r.json();
    render(d);
  }catch(e){ out.innerHTML='<span class="err">Request failed: '+e+'</span>'; }
  btn.disabled=false; btn.textContent='Scan URL';
}

function render(d){
  const phish = d.verdict==='phishing';
  const pct = (d.phishing_probability*100).toFixed(1);
  let g='';
  if(d.modality_gates){
    const gg=d.modality_gates;
    g='<div class="gates">'+['url','visual','text'].map(k=>{
      const v=Math.round((gg[k]||0)*100);
      return `<div class="gate"><div class="k">${k}</div><div class="v">${v}%</div>
              <div class="barbg"><div class="bar" style="width:${v}%"></div></div></div>`;
    }).join('')+'</div>';
  }
  const reasons=(d.explanation&&d.explanation.summary||[]).map(s=>`<li>${s}</li>`).join('');
  let brand='';
  if(d.explanation&&d.explanation.brand_match){
    const b=d.explanation.brand_match;
    brand=`<div class="brand">Looks like <b>${b.brand}</b> (${Math.round(b.similarity*100)}% visual match) — legitimate domain is <code>${b.legit_domain}</code></div>`;
  }
  out.innerHTML=`
    <div class="verdict">
      <span class="badge ${phish?'b-phish':'b-legit'}">${phish?'⚠ PHISHING':'✓ LEGITIMATE'}</span>
      <span class="prob">${pct}%</span>
      <span class="meta">threshold ${d.threshold}<br>${d.latency_ms} ms · decided by ${d.decided_by||'model'}</span>
    </div>
    ${g}
    <h3>Why</h3><ul>${reasons||'<li>No dominant signal.</li>'}</ul>
    ${brand}`;
}
btn.onclick=scan;
document.getElementById('url').addEventListener('keydown',e=>{if(e.key==='Enter')scan();});
</script>
</body>
</html>
